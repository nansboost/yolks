name: build-nodejs-yolks

on:
  push:
    branches: [main]
    paths: ["dockerfiles/**", ".github/workflows/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "23", "24", "25"]
    steps:
      - uses: actions/checkout@v4

      # GHCR requires lowercase image names
      - name: Lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/nodejs.Dockerfile
          push: true
          build-args: NODE_VERSION=${{ matrix.node }}
          tags: ghcr.io/${{ env.OWNER_LC }}/yolks:nodejs_${{ matrix.node }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
